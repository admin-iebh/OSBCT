name: Deploy site to GitHub Pages

# Publishes the contents of site/ to GitHub Pages on every push to main.
#
# THIS IS THE SITE, not a mirror.  `site/CNAME` holds `buddha-dhamma.net`, and a
# CNAME file in the published directory is how GitHub Pages binds a custom
# domain — so this workflow is what serves the domain.  The line that used to
# sit here called this "a mirror/backup of the primary site hosted on
# Cloudflare" and was contradicted by the file beside it.
# `site/DEPLOY.md` still documents a Cloudflare Pages route; see the note at its
# head.  DNS could not be checked from the sandbox that corrected this, so the
# Cloudflare instructions were flagged rather than deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # !!! THE ARTIFACT WAS OVER THE LIMIT AND THE DEPLOY FAILED (8c86ae0,
      # 2026-08-06, "All jobs have failed" after 11m31s).  `site/` is 1.62 GB
      # and GitHub Pages publishes at most 1 GB.  Two things account for the
      # excess and a reader fetches neither: 478 MB of `.bak*`/`.pre*` working
      # history, and 362 MB of plain JSON in `lookup_eval/dpd/` whose `.gz`
      # sibling is what `panel.js` actually requests.  1.62 - 0.478 - 0.362 =
      # 0.80 GB.
      #
      # This prunes the CHECKOUT, never the repository: the history stays,
      # only the uploaded copy is smaller.  It prints what it removes, so the
      # deploy log says why the published tree differs from the repo.
      - name: Prune what is not served, so the artifact fits
        run: python3 pipeline/prune_for_pages.py --write

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
