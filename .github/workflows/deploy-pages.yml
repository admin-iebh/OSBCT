name: Deploy site to GitHub Pages

# Publishes the contents of site/ to GitHub Pages on every push to main.
#
# THIS IS THE SITE, not a mirror.  `site/CNAME` holds `buddha-dhamma.net`, and a
# CNAME file in the published directory is how GitHub Pages binds a custom
# domain — so this workflow is what serves the domain.  The line that used to
# sit here called this "a mirror/backup of the primary site hosted on
# Cloudflare" and was contradicted by the file beside it.
# `site/DEPLOY.md` still documents a Cloudflare Pages route; see the note at its
# head.  DNS could not be checked from the sandbox that corrected this, so the
# Cloudflare instructions were flagged rather than deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# !!! DO NOT CANCEL A PAGES DEPLOYMENT IN FLIGHT.
# This was `cancel-in-progress: true`, and on a Pages workflow that is a trap.
# The `github-pages` environment allows ONE deployment in progress at a time.
# Cancelling a run mid-deploy can leave that slot held by a deployment which
# never completes, and every run afterwards then waits for a slot that is never
# freed and dies at the ten-minute maximum.
#
# The run list says exactly that happened here.  #108 published in 1m52s.  #109
# was CANCELLED at 5m34s by this setting.  #110 was the first "Timeout reached,
# aborting!" at 11m41s, and #112 and #113 the same — while the site itself did
# not change: 26,576 files then and now, 8 files different in total.
#
# `false` means a push that arrives during a deploy waits its turn instead of
# killing it.  Queueing costs a few minutes; a stuck lock costs every deploy
# after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # !!! A PRUNE STEP STOOD HERE FOR ONE COMMIT AND ITS PREMISE WAS WRONG.
      # It was added believing `site/` to be 1.62 GB against a 1 GB cap.  That
      # was a measurement of the LOCAL WORKING TREE, which carries untracked
      # build output.  What CI checks out is **0.81 GB in 26,576 files** —
      # already under the cap.  `lookup_eval/dpd/*.json` is gitignored already
      # (see .gitignore:140, which records that this was solved once before);
      # only the `.gz` is tracked.  Of 1,751 backup files, 18 are tracked.
      # The step saved ~16 MB and was removed rather than left as an
      # unjustified moving part in the one workflow that publishes the site.
      # `pipeline/prune_for_pages.py` is kept, unwired, as the record.

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      # !!! THE REAL CAUSE OF THE FAILING DEPLOYS, AND IT IS A CLOCK.
      # `actions/deploy-pages` waits for GitHub to finish publishing and gives
      # up after `timeout`, whose default is 600000 ms — ten minutes — with
      # "Timeout reached, aborting!".  Measured on this repository:
      #
      #   #110 8c86ae0  FAILED   11m41s
      #   #111 9afc115  ok        9m36s
      #   #112 abeedfb  FAILED   11m40s
      #   #105/#107/#108 ok      ~2m
      #
      # Both failures sit at ten minutes plus overhead and the slow success at
      # 9m36s, just under.  It is a race, not a fault: 26,576 files take
      # GitHub a variable time to publish and sometimes that is longer than
      # the action will wait.
      #
      # #112 is what rules out every content explanation, including the one I
      # gave first: it changed A SINGLE MARKDOWN FILE.  The site bytes were
      # identical to #111, which had just succeeded.
      #
      # !!! AND THE TIMEOUT CANNOT BE RAISED.  Setting `timeout: 1800000` was
      # tried at 14f16795 and run #113 answered it in its own annotations:
      #
      #   Warning: timeout value is greater than the allowed maximum
      #            - timeout set to the maximum of 600000 milliseconds.
      #   Timeout reached, aborting!
      #
      # 600000 is the MAXIMUM, not merely the default.  Ten minutes is a
      # ceiling.  The input is therefore left unset — passing it only earns
      # the warning and changes nothing.
      #
      # The artifact itself is fine: #113 produced `github-pages`, 216 MB,
      # successfully.  What runs out of clock is Pages PUBLISHING it, and the
      # variable is the file count — 26,576 of them, most of it the dictionary
      # shards (lookup_eval/dpd 11,229, lem 5,244; lookup/gloss 4,103).
      #
      # !!! FIXED 2026-08-07, AND NOT BY RESHARDING.  The paragraph that stood
      # here said "the only real remedy is fewer, larger files" and pointed at
      # the shard cap.  That was measured and found wrong: `CAP` is a ceiling
      # the sharder never merges against, so raising it merges nothing
      # (DEPLOY_SCALE §3a).  The remedy taken instead was to stop PUBLISHING the
      # stores at all.
      #
      # This workflow uploads `./site` and nothing else, so moving `lookup/` and
      # `lookup_eval/` OUT of site/ — to `stores/` in this same repository —
      # removes them from the artifact without removing them from the project.
      # They are served from https://dict.buddha-dhamma.net (Cloudflare R2);
      # `site/reader/panel.js` names that origin in two lines.  Because they are
      # still tracked here, they are still inside the Zenodo deposit, so an
      # archived copy years from now still has a working dictionary panel.
      # That is the whole argument for Option D over Option B alone.
      #
      # MEASURED AFTER THE MOVE: `git ls-files site/` = 1,977, down from 26,576.
      # The clock should stop being a race.  If a run still times out at ~11m40s
      # with 1,977 files, the file count was NOT the cause and DEPLOY_SCALE §1a's
      # other two shapes are where to look — an unacquired runner, or a pending
      # deployment holding the environment.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
