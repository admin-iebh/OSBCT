<style>

body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);

.seclabel{font-family:'Gentium Plus',Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--fg);padding:13px 10px 7px;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px}

/* !!! THE SECTION ROWS HAD NO STYLES AT ALL (2026-07-30o, user-reported): they

.sr-hit{padding:7px 12px;border-radius:8px;cursor:pointer;display:flex;
        align-items:baseline;gap:8px}

        white-space:nowrap;margin-left:auto}

.grid{display:grid;gap:14px 16px}.rowline{display:contents}.stack{max-width:820px;margin:0 auto}
.para{font-family:'Gentium Plus',serif;font-size:var(--rsize);line-height:1.62;padding:9px 13px;border-radius:11px;border:1px solid transparent;position:relative;scroll-margin-top:14px}
.para.canon{border-left:3px solid var(--canon)}.para.l-A{border-left:3px solid var(--comm)}.para.l-T{border-left:3px solid var(--tika)}
.para.empty{color:var(--faint);text-align:center;font-size:18px;line-height:1;border:none;padding:14px 0;opacity:.5}
.rowline.hot .para{background:var(--hover);border-color:var(--line)}.rowline.hot .para.canon{border-left-color:var(--canon)}.rowline.hot .para.l-A{border-left-color:var(--comm)}.rowline.hot .para.l-T{border-left-color:var(--tika)}

.lchip.a{background:var(--comm);color:#fff}.lchip.t{background:var(--tika);color:#fff}
.subwrap.a{margin-left:20px}.subwrap.t{margin-left:40px}
.cmt-outline{margin-top:3px}.unit{margin:1px 0;border-radius:8px}
.unit .uhead{cursor:pointer;display:flex;align-items:baseline;gap:7px;padding:3px 6px;border-radius:7px}.unit .uhead:hover{background:var(--hover)}

.icn,.jbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.icn{width:24px;height:22px;color:var(--mut)}.icn:hover{color:var(--fg);border-color:var(--faint)}.icn.ok{color:var(--comm);border-color:var(--comm)}
.jbtn{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;width:22px;height:22px}.jbtn:hover{background:var(--hover)}.jbtn.off{opacity:.28;cursor:default}
.pgrule{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.06em;color:var(--faint);text-transform:lowercase}
.pgrule:before,.pgrule:after{content:'';flex:1;height:1px;background:var(--line)}
.pgrule a{color:inherit;text-decoration:none}.pgrule a:hover{color:var(--accent)}
.pgmk{font-family:'Inter',sans-serif;font-size:10px;color:var(--faint);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:1px 6px}.pgmk:hover{color:var(--accent)}
.appx{margin:7px 0 0;padding:6px 11px;border-left:2px solid var(--line);background:var(--app);border-radius:0 8px 8px 0;font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.5;color:var(--mut)}

.appx abbr{text-decoration:none;border-bottom:1px dotted var(--faint);cursor:help}
.appx .xref{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px solid transparent}.appx a.xref:hover{border-bottom-color:var(--accent)}
.pagemark{display:block;text-align:center;color:var(--faint);font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.06em;margin:16px 0 8px;text-decoration:none}
.pagemark::before,.pagemark::after{content:"";display:inline-block;width:30%;height:1px;background:var(--line);vertical-align:middle;margin:0 10px}.pagemark:hover{color:var(--accent)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
#toast.show{opacity:.96;transform:translateX(-50%) translateY(0)}
mark.shl{background:var(--shl,#ffdf7e);color:#111;border-radius:2px;padding:0 1px}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;line-height:1.3;white-space:normal;width:max-content;max-width:230px;text-align:center;padding:5px 9px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.26);z-index:200;pointer-events:none}
@media(max-width:860px){body{grid-template-columns:0 1fr}.side{position:fixed;top:52px;bottom:0;left:0;width:84%;max-width:330px;z-index:30;box-shadow:2px 0 16px rgba(0,0,0,.3)}body:not(.showsb) .side{display:none}}
</style>

<script>
const $=s=>document.querySelector(s);
if(window.I18N) Object.assign(window.I18N,{
  r2_search_ph:{en:'Search all layers — diacritics optional',es:'Buscar en todas las capas — diacríticos opcionales'},
  r2_layers:{en:'Layers',es:'Capas'},
  r2_columns:{en:'Columns',es:'Columnas'},
  r2_tabs:{en:'Tabs',es:'Pestañas'},
  r2_single:{en:'Single',es:'Simple'},
  r2_outline:{en:'☰ Outline',es:'☰ Esquema'},
  r2_contents:{en:'☰ Contents',es:'☰ Contenido'}
});
document.documentElement.setAttribute('data-theme', localStorage.getItem('osbct-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#themebtn').onclick=()=>{const d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);localStorage.setItem('osbct-theme',n)};
$('#sidetog').onclick=()=>{document.body.classList.toggle('nosb');document.body.classList.toggle('showsb')};
const META={canon:{letter:'P',name:'Pāḷi (Tipiṭaka)',col:'var(--canon)'},A:{letter:'A',name:'Aṭṭhakathā',col:'var(--comm)'},T:{letter:'T',name:'Ṭīkā',col:'var(--tika)'}};
const LAYERKIND={canon:'canon',commentary:'A',subcommentary:'T'};
const state={view:'single',active:{canon:true,A:false,T:false},tab:'canon',size:15.5,reading:'full',canonVol:null,scrollKey:null,filter:null,curvagga:null};
let NAV=null, VOLLAYER={}, VOLWORK={}, VOLGROUP={}, VOLBAND={}, GROUPHAS={}, PAGEIDX={}, PDFBLANK={}, PAGESPAN={}, VOLTITLE={}, VOLSECTIONS={}, VOLKIND={}, VOLTOC={}, VOLPDFTOC={}, VOLBOOK={}, VOLNESTED={}, VAGCONTENTS={}, SUTTASUBS={}, SUTTALABEL={}, HEADMAP={}, BOOKSPAN={}, VAGGASPAN={};
const cache={}, linkCache={}, revCache={};
// THE VOLUME PART-NUMBER, AS A ROMAN NUMERAL IN THE SIDEBAR.
// The edition names a multi-volume work's parts in Pāḷi on the title page —
// "Jātakapāḷi (Paṭhamo bhāgo)", "Paṭṭhānapāḷi (Pañcamo bhāgo)" — and nav.json
// records that, because it is what the page says.  In the left pane it is long
// and it buries the part number at the end of the line, so the pane shows
// "Jātakapāḷi I" and "Paṭṭhānapāḷi V" instead.  The Ṭīkā layer was already
// written that way ("Mūlapaṇṇāsaṭīkā I"), so this makes the pane consistent.
// DISPLAY ONLY: nav.json keeps the edition's own wording.
// AN UNRECOGNISED ORDINAL IS LEFT ALONE rather than guessed at — a title that
// silently loses its part number would be worse than a long one.
const BHAGA={'paṭhamo':'I','dutiyo':'II','tatiyo':'III','catuttho':'IV','pañcamo':'V',
             'chaṭṭho':'VI','sattamo':'VII','aṭṭhamo':'VIII','navamo':'IX','dasamo':'X',
             'ekādasamo':'XI','dvādasamo':'XII','terasamo':'XIII','cuddasamo':'XIV'};
function bhagaRoman(t){
  if(!t) return t;
  return t.replace(/\s*\(\s*(\S+)\s+bhāg\S*\s*\)\s*$/i, (m,ord)=>{
    const r=BHAGA[ord.toLowerCase()];
    return r? ' '+r : m;            // unrecognised: keep the printed wording
  });

      || /\s{2,}\d+\.?$/.test(t) || /^\d+(-\d+)?\.?$/.test(t)        // index entry 'word   95', page-ref '530-5'
      || /[ṁṃ]\d*\.\s*$/.test(t) || /niṭṭhit/i.test(t)              // section CLOSING marker 'Dvattiṁsākāraṁ.', 'Xvaggo niṭṭhito'
      || /^[a-zāīūṁṅñṭḍṇḷ]/.test(t)                                     // lowercase fragment
      || /\((Ka|Sī|Syā|I|Ka-Sī|Kaṁ)\)\s*$/.test(t); };               // siglum tail

  // it (name index, verse index / Gāthāsūci, variant-reading lists) is not content.
  const backmatter=t=>/anukkamaṇik|(gāthā|pada)sūci|nānāpāṭh/i.test(t||'');
  const secs=[]; const byOrd={}; let pi=0, seq=0, bm=false, lastOrd=-1, lastKey='';
  const nkey=t=>(t||'').trim().replace(/[ṁṃ]?\d*\.?\s*$/,'').toLowerCase();  // strip closing 'ṁ.'/'.'
  for(const hd of (c.headings||[])){
    if(hd.kind!=='section') continue;
    if(bm) continue;
    if(backmatter(hd.title)){ bm=true; continue; }
    if(junk(hd.title)) continue;
    const kk=nkey(hd.title); if(kk && kk===lastKey) continue;  // drop the closing echo ('Kumārapañhā' then 'Kumārapañhā.') and consecutive dups
    lastKey=kk;

    // the same paragraph — advance so consecutive same-page headings spread out
    let ord=Math.min(pi, c.paras.length-1);

    return {title:s.label, domid:'s-'+s.key.replace('#','-'), sections:secs.filter(x=>x.page>=s.page&&x.page<nextP).map(x=>({title:x.title,domid:x.id}))}; });

  const vol=parseKey(key)[0]; const {mine,bands}=bandsFor(vol);
  const targets=bands.filter(b=>b!==mine);
  const COL={P:'var(--canon)',A:'var(--comm)',T:'var(--tika)'},NAME={P:'Pāḷi',A:'Aṭṭhakathā',T:'Ṭīkā'};
  return targets.map(tg=>'<button class="jbtn" style="color:'+COL[tg]+';border-color:'+COL[tg]+'" title="Go to '+NAME[tg]+'" onclick="jumpFrom(\''+key+'\',\''+tg+'\')">'+tg+'</button>').join('');
}
window.jumpFrom=async function(key,tg){

        SLOT={A:'commentary',T:'subcommentary'};

  // NOT ALWAYS THE CANON.  The Visuddhimagga group has no canon at all, so
  // `linksk/51Vism01.links.json` carries the SUBCOMMENTARY targets and
  // `25VsmT01.rev.json` points its `canon` field back at 51Vism01 — the
  // aṭṭhakathā standing in the spine's place.  So the routing question is
  // "is this volume its group's SPINE?", never "is this canon?".

  let targetKey=null;
  if(mine===spine){
    const links=(vol===state.canonVol&&state.links)?state.links:await loadLinks(vol);
    const arr=((links[String(ord)]||{})[SLOT[tg]])||[]; targetKey=arr[0]&&arr[0].key;
  } else {
    const rev=await loadRev(vol); const c=(rev[String(ord)]||{}).canon;
    if(!c){ toast('No linked '+NAME[spine]); return; }
    if(tg===spine){ targetKey=c; }
    else { const [cv,co]=parseKey(c); const links=await loadLinks(cv);
           const arr=((links[String(co)]||{})[SLOT[tg]])||[]; targetKey=arr[0]&&arr[0].key; }

  // reveals blocks the CURRENT spine already draws, so a jump that leaves the
  // spine's own group had nothing to scroll to and FAILED SILENTLY — which is
  // what 25VsmT01's buttons have been doing, since it has no links map of its
  // own and its rev map points into a volume the spine never draws.
  setTimeout(async ()=>{ const el=document.getElementById('p-'+targetKey.replace('#','-'));
    if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash');
            setTimeout(()=>el.classList.remove('flash'),1500); }
    else { await openKey(targetKey, LK[tg]); } },60);

};

  // spine skips hidden ordinals (`if(HIDE[String(i)])return ''`), but that
  // HIDE is the CANON volume's, indexed by canon ordinal — nothing anywhere
  // consulted the TARGET volume's.  So 07DiA01 drew its leaked heading ord0
  // ("Sīlakkhandhavaggaṭṭhakathā") and its 25,625-character unnumbered ord4 as
  // body paragraphs, and a reader opening the volume met a wall of footnote
  // markers with no readable text.  User-reported, 2026-07-27af.
  arr=arr.filter(t=>{const a=parseKey(t.key); const c=cache[a[0]];
                     return !(c && c.hide && c.hide[String(a[1])]);});

  return arr.map(t=>{const v=parseKey(t.key)[0]; return {key:t.key,state:t.state,worktag: multi? ((shortWork(VOLWORK[v])||'')+' · '+v) : null};});

const hfold=s=>s.toLowerCase().replace(/[āīūṁṃṅñṭḍṇḷ]/g,c=>HLFOLD[c]||c);
function markInEl(el,q){
  if(!el||!q) return; const fq=hfold(q.trim()); if(!fq) return;
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  const nodes=[]; while(walker.nextNode()){ if(walker.currentNode.parentNode.nodeName!=='MARK') nodes.push(walker.currentNode); }
  for(const node of nodes){
    const text=node.nodeValue, f=hfold(text); let idx=f.indexOf(fq); if(idx<0) continue;
    const frag=document.createDocumentFragment(); let last=0;
    while(idx>=0){ if(idx>last)frag.appendChild(document.createTextNode(text.slice(last,idx)));
      const m=document.createElement('mark'); m.className='shl'; m.textContent=text.slice(idx,idx+fq.length);
      frag.appendChild(m); last=idx+fq.length; idx=f.indexOf(fq,last); }
    if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag,node);
  }
}
async function resolveHash(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,'')); if(!h) return null;
  let vol=null, rest=null;
  if(h.includes('#')){ [vol,rest]=h.split('#'); }
  else { const i=h.indexOf('/'); if(i<0) return null; vol=h.slice(0,i); rest=h.slice(i+1); }
  if(!vol||!(vol in VOLLAYER)) return null;
  if(/^\d+$/.test(rest)) return vol+'#'+rest;
  const c=await loadVol(vol);
  const i=(c.paras||[]).findIndex(p=>p&&p.id===rest);
  return i>=0 ? vol+'#'+i : vol+'#0';
}
async function openFromURL(){
  const key=await resolveHash(); if(!key) return false;
  const LK={canon:'canon',commentary:'A',subcommentary:'T'};
  const vol=parseKey(key)[0];
  await openKey(key, LK[VOLLAYER[vol]]||'canon');
  const q=new URLSearchParams(location.search).get('q')||'';
  // WAIT FOR THE PARAGRAPH, DO NOT GUESS A DELAY.  A fixed timeout raced the
  // reader's own render: the highlight appeared on some runs and not others,
  // which is the worst kind of green.  Polls a bounded number of times and
  // gives up quietly if the ordinal is never drawn (a hidden one, say).
  for(let i=0;i<40;i++){
    const el=document.getElementById('p-'+key.replace('#','-'));
    if(el){ el.scrollIntoView({block:'center'}); if(q) markInEl(el,q); return true; }
    await new Promise(r=>setTimeout(r,60));
  }
  return true;
}
buildSidebar().then(()=>openFromURL());
window.addEventListener('hashchange',()=>{ openFromURL(); });
