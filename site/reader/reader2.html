<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — Sixth Buddhist Council Tipiṭaka</title>
<!-- Type is self-hosted.  It used to come from fonts.googleapis.com, which meant
     that where Google Fonts is blocked -- mainland China, intermittently
     Myanmar -- this page fell back to a generic serif and the Pāḷi diacritics
     rendered from whatever that face happened to carry.  For `ṁ ṅ ṭ ḍ ṇ ḷ` that
     is frequently nothing.  See ../fonts/fonts.css: the diacritics live in the
     `latin-ext` subset, NOT `latin`, and both files are required. -->
<link rel="preload" href="../fonts/gentium-plus-latin-ext-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
/* --rsize LIVES ON :root, NOT ON .scroll.  The word-lookup panel is
   `position:fixed`, so it is outside the `.scroll` subtree and could not
   inherit a variable set there -- which is why its body was hardcoded to
   13.5px and ignored the reader's own A- / A+ buttons entirely.  A reader who
   enlarged the text because they needed to got no help in the pane where the
   definitions are.  Setting it here puts it in scope for both. */
:root{--rsize:15.5px;
  --bg:#f7f5f1;--panel:#fffdf9;--fg:#211f1a;--mut:#756d63;--faint:#918b7f;--line:#ece7dd;--accent:#88693a;
  --canon:#976e27;--comm:#2a7a6c;--tika:#7a5cc0;--hover:#f0ebe1;--active:#efe7d7;--chip:#efeae0;--chipfg:#6a5f4d;--app:#f5f1e8;--hl:#fbe7b8}
/* CONTRAST, MEASURED AGAINST BOTH BACKGROUNDS THESE TOKENS SIT ON -- not just
   --panel.  The earlier survey checked --panel alone and stopped there, but
   .wl-banner, .wl-cites, .wl-promo and the reader's own .appx apparatus block
   are --app, which is darker, so a value that just clears 4.5:1 on --panel is
   still under AA where it is most used.  Measured, old -> new:

     token      old        --panel        --app          also
     --mut      #8a8175    3.77 -> 5.01   3.40 -> 4.52
     --comm     #2f8a7a    4.10 -> 5.04   3.70 -> 4.55   #fff on it 4.17 -> 5.12
     --canon    #b8862f    3.19 -> 4.52   2.87 -> 4.07   --panel on it 3.24 -> 4.52
     --accent   #8a6a3b    4.92 -> 5.01   4.43 -> 4.51   #fff on it 4.99 -> 5.09
     --faint    #b7afa0    2.14 -> 3.33   1.93 -> 3.00   (3:1, a third tier)

   --canon is the one to read twice: it is NEVER text.  It is a 3px border on
   .para.canon and .wl-wordgrp, a dot, and -- the reason it changes -- the
   background of `.lbtn.on[data-k=canon]`, which sets `color:#fff`.  White on
   the old value was 3.24:1.  The layer buttons were the failure, not the
   paragraph numbers (those are --accent, and always passed).

   Darkening is multiplicative, so the hue is held exactly and the palette
   stays warm.  Dark theme is untouched except --faint, which was 2.36:1. */
html[data-theme=dark]{--bg:#141210;--panel:#1c1a16;--fg:#ece6da;--mut:#8f867a;--faint:#6f6759;--line:#2a2620;--accent:#cba976;
  --canon:#d6a94e;--comm:#4fbfa8;--tika:#a487e6;--hover:#232019;--active:#2b2618;--chip:#282318;--chipfg:#d8c9a6;--app:#201d16;--hl:#5c4a1c}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);
  display:grid;grid-template-columns:300px 1fr;grid-template-rows:52px 1fr;grid-template-areas:"top top" "side main";height:100vh;overflow:hidden;transition:grid-template-columns .2s}
/* !!! `nosb` MUST NOT APPLY ON A PHONE (2026-07-31c, user-reported: the
   left pane never appeared on an iPhone while an iPad was fine).
   Two rules disagreed. Below 860px the pane starts hidden by
   `body:not(.showsb) .side{display:none}`, and the ☰ button toggles BOTH
   classes at once — so `showsb` released that rule and `nosb` instantly
   re-hid it through the unconditional rule that used to live here. The
   pane was unreachable at any width <=860px; above it only `nosb` has a
   rule, which is why a landscape iPad worked.
   `nosb` means "the user hid a pane that is shown by default" and belongs
   to WIDE screens only; `showsb` means "the user revealed a pane that is
   hidden by default" and belongs to narrow ones. */
@media(min-width:861px){body.nosb{grid-template-columns:0 1fr}body.nosb .side{display:none}}
.pali{font-family:'Gentium Plus',Georgia,serif}
/* !!! THE TOP BAR WAS UNUSABLE IN PORTRAIT ON EVERY PHONE (2026-08-01).  It is
   one non-wrapping flex row with no narrow-screen rule at all, so nothing
   shrank and the right-hand controls simply left the viewport.  Measured in
   Chromium by sweeping the viewport from 900px down in 10px steps:

     <=790px   the brand wraps and is clipped by the 52px header  (iPad portrait)
     <=540px   the theme button leaves the viewport
     <=500px   the language button leaves too
     <=440px   Errata,  <=380px About,  <=320px Downloads

   So there are TWO faults with different thresholds, and one blanket rule at
   the sidebar's 860px would have relocated links at 768px where they still fit.
   Each breakpoint is set from the width its own symptom starts at.

   `ES` and `◐` are READING controls — dark mode gets toggled mid-session — so
   they keep their place in the bar.  Home/Downloads/About/Errata are
   navigate-away actions used rarely, and on a narrow screen the ☰ panel is
   already the navigation surface, so that is where they go. */
#sidelinks{display:none;border-top:1px solid var(--line);margin:14px 4px 0;padding:10px 0 0}
@media(max-width:800px){
  .topbar{gap:9px;padding:0 12px}
  .brand{flex:0 1 auto;min-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media(max-width:560px){
  .topbar{gap:8px;padding:0 10px}
  .topbar > .navlink{display:none}
  .search{flex:1 1 90px;min-width:90px;margin-left:0}
  .sp{display:none}
  .tb{padding:6px 8px}
  #sidelinks{display:block}
}
@media(max-width:369px){.topbar > .brand{display:none}}
#sidelinks a{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;padding:7px 9px;border-radius:8px}
#sidelinks a:hover{background:var(--hover)}
.topbar{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:14px}.brand .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}
.tb{font:inherit;font-size:13px;color:var(--mut);background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.tb:hover{background:var(--hover);color:var(--fg)}.tb.on{background:var(--active);color:var(--fg)}
.navlink{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--accent);text-decoration:none;padding:5px 7px;border-radius:7px;white-space:nowrap}.navlink:hover{background:var(--hover)}
.search{position:relative;flex:0 1 420px;margin-left:4px}
.search input{width:100%;font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
.sdrop{position:absolute;top:40px;left:0;right:0;max-height:64vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);z-index:40;padding:4px}
.sp{flex:1}
.side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px 8px 40px}
.side::-webkit-scrollbar{width:9px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.seclabel{font-family:'Gentium Plus',Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--fg);padding:13px 10px 7px;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px}
.seclabel:hover{background:var(--hover)}
.seclabel .gd{width:10px;height:10px;border-radius:50%;margin:0 4px 0 2px;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 12%, transparent)}
.row{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;position:relative;user-select:none}
.row:hover{background:var(--hover)}.row.active{background:var(--active);font-weight:500}
.chev{width:13px;height:13px;flex:none;color:var(--faint);transition:transform .15s}.row.open .chev,.seclabel.open .chev{transform:rotate(90deg)}
.row .lf{width:13px;flex:none}.row .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kids{display:none}.kids.open{display:block}
.sr-head{font-family:'Inter',sans-serif;font-size:11px;color:var(--faint);padding:8px 12px 4px}
.sresult{padding:7px 12px;border-radius:8px;cursor:pointer}.sresult:hover{background:var(--hover)}
/* A hit the index cannot place (no ordinal) is drawn plainly and does not
   pretend to be clickable — see the note beside `_k` in doSearch. */
.sresult.sr-dead{cursor:default;opacity:.62}.sresult.sr-dead:hover{background:none}
.sr-lay{font-size:10.5px;font-weight:600}.sr-snip{font-family:'Gentium Plus',serif;font-size:12.5px;margin-top:2px;line-height:1.4}
/* The book · sutta · volume line on an occurrence row (2026-08-08, user asked
   for "the book and sutta, not just Pāḷi ¶52").  Small and muted so the
   snippet stays the row's voice. */
.sr-where{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--mut);margin-left:8px}
/* Layer chips + "?" help at the top of the dropdown (2026-08-08).  In the
   dropdown, not beside the input — `.search` shrinks to 90px on a phone. */
.sr-filt{display:flex;gap:5px;align-items:center;padding:7px 10px 3px;flex-wrap:wrap}
.sr-chip{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;color:var(--mut);
         border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer}
.sr-chip:hover{background:var(--hover)}
.sr-chip.on{color:var(--accent);border-color:var(--accent)}
.sr-help{margin-left:auto;padding:2px 8px}
.sr-helpbox{font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.55;color:var(--mut);
            padding:6px 12px 8px;border-bottom:1px solid var(--line)}
.sr-snip mark{background:var(--hl);border-radius:2px}
/* !!! THE SECTION ROWS HAD NO STYLES AT ALL (2026-07-30o, user-reported): they
   inherited the body serif at full size and carried no cursor and no hover, so
   they read as a heading rather than as the links they are, and dwarfed the
   occurrence rows beneath them.  Same padding, radius, cursor and hover as
   `.sresult`, so the dropdown has ONE idiom; the name a little larger than a
   snippet because it is the thing being chosen, and the location as the same
   small coloured chip `.sr-lay` uses. */
.sr-hit{padding:7px 12px;border-radius:8px;cursor:pointer;display:flex;
        align-items:baseline;gap:8px}
.sr-hit:hover{background:var(--hover)}
.sr-hit .sr-name{font-family:'Gentium Plus',serif;font-size:14px;line-height:1.3}
.sr-loc{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;
        white-space:nowrap;margin-left:auto}
.main{grid-area:main;overflow:hidden;display:flex;flex-direction:column}
.docbar{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.doctitle{font-family:'Gentium Plus',serif;font-size:16px;font-weight:700;line-height:1.1}
.doctitle small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:400;color:var(--mut);margin-top:1px}
.grouplabel{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.tocwrap{position:relative}
.tocdrop{position:absolute;top:36px;left:0;width:340px;max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);z-index:45;padding:4px}
.tocitem{padding:5px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;font-family:'Gentium Plus',serif}.tocitem:hover{background:var(--hover)}
.toc-sutta{font-weight:700}
.toc-sec{padding-left:28px;font-size:12.5px;color:var(--mut)}
.tochead{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 12px 4px}
.layerbar{display:flex;gap:5px}
.lbtn{font:inherit;font-size:14px;font-weight:600;width:34px;height:32px;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:9px;cursor:pointer}
/* !!! NOT `color:#fff`.  These three tokens are FOREGROUND colours in dark
   theme -- light gold, mint, lilac -- so white text sat on them at 2.18:1,
   2.25:1 and 2.92:1.  The earlier survey never saw it because it measured
   every token AS a foreground against --panel and stopped there; nothing
   measured the case where a token IS the background.  --panel flips with
   the theme and clears AA in both: light 4.52-5.04, dark 5.95-7.98. */
.lbtn.noav{opacity:.42;border-style:dashed}
.jbtn.none{color:var(--mut);border-color:var(--line);border-style:dashed;opacity:.55;cursor:default}
/* CONDEMNED, NOT ABSENT.  `.none` above is grey, dashed and dead.  This keeps
   the band's colour and its click -- the link resolves -- and says so with
   weight alone, so the two states cannot be read as the same state. */
.jbtn.dim{opacity:.5;border-style:dotted;font-weight:500}
.jbtn.dim:hover{opacity:1}
.lbtn.on{color:var(--panel)}.lbtn.on[data-k=canon]{background:var(--canon);border-color:var(--canon)}.lbtn.on[data-k=A]{background:var(--comm);border-color:var(--comm)}.lbtn.on[data-k=T]{background:var(--tika);border-color:var(--tika)}
.viewtog,.rctrl{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.viewtog button,.rctrl button{font:inherit;font-size:12px;color:var(--mut);background:var(--panel);border:none;padding:6px 11px;cursor:pointer}
.viewtog button.on{background:var(--active);color:var(--fg);font-weight:500}
.rctrl button{border-right:1px solid var(--line)}.rctrl button:last-child{border-right:none}
.scroll{overflow-y:auto;padding:20px 22px 130px;flex:1}  /* --rsize moved to :root, see above */
.scroll::-webkit-scrollbar{width:11px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.incipit{font-family:'Gentium Plus',serif;font-style:italic;color:var(--accent);text-align:center;font-size:15px;margin:2px 0 16px}
.uddana{text-align:center;margin:14px auto 22px;max-width:640px;color:var(--mut)}
.udd-label{font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.02em;margin-bottom:5px}
.udd-verse{font-family:'Gentium Plus',serif;font-style:italic;font-size:calc(var(--rsize,16px) - 1px);line-height:1.7;color:var(--fg)}
.uddana .appx{text-align:left;display:inline-block;margin-top:8px}
.head{font-family:'Gentium Plus',Georgia,serif;scroll-margin-top:14px}
.head.bookseries{font-size:15px;font-weight:600;color:var(--mut);margin:30px 0 0;text-align:center;letter-spacing:.04em}
.head.bookseries+.head.booktitle{margin-top:2px}
.head.booktitle{font-size:27px;font-weight:700;color:var(--fg);margin:30px 0 6px;text-align:center;letter-spacing:.01em}
.head.sutta{font-size:20px;font-weight:700;color:var(--fg);margin:26px 0 12px;text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.head.vagga{font-size:17px;font-weight:700;color:var(--fg);margin:20px 0 8px;text-align:center}
.head.section.band{margin:6px 0 4px}
.head.section{font-size:14.5px;font-weight:600;color:var(--accent);margin:15px 0 5px;text-align:center;scroll-margin-top:14px}
.head.vatthu{font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 4px;text-align:center;scroll-margin-top:14px}
.gatha{font-family:'Gentium Plus',serif;font-style:italic;line-height:1.7;margin:8px 0 4px 1.6em;color:var(--fg)}
.gatha .pn{font-style:normal;margin-left:-1.6em;margin-right:.4em}
.gatha-end{font-size:12px;color:var(--mut);margin-left:.6em}
.gatha-count{font-size:12px;color:var(--mut);margin-left:1.6em;font-style:italic}
.gatha-after{margin-top:10px}

.secprose{font-family:'Gentium Plus',serif;line-height:1.62;margin:8px 0 4px;color:var(--fg)}
.flash{animation:flashkf 1.5s ease}
.colhead{display:grid;gap:16px;position:sticky;top:-20px;background:var(--bg);padding:8px 0 6px;z-index:2}
.colhead .ch{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:7px;color:var(--mut)}
.colhead .ch .cdot{width:7px;height:7px;border-radius:50%}
.grid{display:grid;gap:14px 16px}.rowline{display:contents}.stack{max-width:820px;margin:0 auto}
.para{font-family:'Gentium Plus',serif;font-size:var(--rsize);line-height:1.62;padding:9px 13px;border-radius:11px;border:1px solid transparent;position:relative;scroll-margin-top:14px}
.para.canon{border-left:3px solid var(--canon)}.para.l-A{border-left:3px solid var(--comm)}.para.l-T{border-left:3px solid var(--tika)}

.rowline.hot .para{background:var(--hover);border-color:var(--line)}.rowline.hot .para.canon{border-left-color:var(--canon)}.rowline.hot .para.l-A{border-left-color:var(--comm)}.rowline.hot .para.l-T{border-left-color:var(--tika)}
.para.flash{animation:flashkf 1.5s ease}@keyframes flashkf{0%,20%{background:var(--active)}100%{background:transparent}}

.para .pn.k-A{color:var(--comm)}.para .pn.k-T{color:var(--tika)}
sup.fnm{color:var(--accent);font-size:9.5px;font-weight:700;vertical-align:super}
.lemma{font-weight:700}

.worktag{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:600;color:var(--mut);margin-right:6px}

// !!! OPENING ONE VOLUME USED TO FETCH EVERY VOLUME ITS LINKS POINT INTO, IN
// FULL, BEFORE THE FIRST RENDER (2026-07-31b, user-reported: the site was
// "very slow to load and became unresponsive" on an iPhone and iPad).
// `openCanon` gathered every target of every link and awaited `loadVol` on all
// of them — and `loadVol` fetches TEN files per volume (the volume, bold, sect,
// apparatus, uddāna, sections, hide, verse, incipit, booktitle).
//
// Measured on 18Khu01, whose commentary runs to seven KhuA volumes plus ṭīkā:
// **190 files, 31.4 MB, before a single word was drawn.** 39Abhi11: 14.7 MB.
// The `verse/` maps alone were 10.6 MB of it.
//
// And **none of it was on screen.** Opening a canon paragraph sets
// `state.active={canon:true,A:false,T:false}` — the Aṭṭhakathā and Ṭīkā bands
// are OFF — so every one of those megabytes was fetched and parsed to draw
// bands the reader had not asked for. Desktop broadband hides this; a phone on
// cellular cannot, and iOS Safari's memory ceiling is far lower than a laptop's.
//
// Now: load only what an ACTIVE band needs, and load the rest when a band is
// switched on. Every render path already guards with `const c=cache[vol]; if(!c)
// return '';` so an unloaded volume draws nothing rather than throwing — which
// is why this is safe, and also why every place that turns a band ON must await
// this and then re-render, or the band would come up empty.
async function ensureBandVols(){

  const slots=[]; if(on('A')) slots.push('commentary'); if(on('T')) slots.push('subcommentary');

  // into it.  A work reached from the tree is now the SPINE (see `_work` in
  // `render`), so its own volume has to be in the cache; before, it arrived
  // only as the target of a link, and a work with no attested inbound link
  // would have been rendered from an empty cache entry.
  if(state.filter) want.add(state.filter);

  // fetching — a `covered` target would pull a whole volume for a band that
  // is never rendered

  // button.  That is how the commentary block under the Aratisutta still

  // not a second opinion, an absence of one.  Unknown must not look like yes,

    if(hit.length){
      const H=new Set(hit); let rows=SNAMES.rows.filter(r=>H.has(r[0]));
      if(sLayer){ const LK={'pali-unicode':'canon','atthakatha-unicode':'commentary','tika-unicode':'subcommentary'}[sLayer];
                  rows=rows.filter(r=>SNAMES.layers[r[3]]===LK); }
      nSec=rows.length;
      rows.sort((a,b)=>{const A=SNAMES.labels[a[0]],Bb=SNAMES.labels[b[0]];
        return (SNFOLD[a[0]]===fq?0:1)-(SNFOLD[b[0]]===fq?0:1)||A.length-Bb.length;});
      const LN2={'canon':'Pāḷi','commentary':'Aṭṭhakathā','subcommentary':'Ṭīkā'};
      secHTML='<div class="sr-head">'+nSec+' section'+(nSec===1?'':'s')+'</div>'+
        rows.slice(0,10).map(r=>'<div class="sr-hit" onclick="openKey(\''+
          SNAMES.vols[r[1]]+'#'+r[2]+'\',\''+({canon:'canon',commentary:'A',subcommentary:'T'})[SNAMES.layers[r[3]]]+
          '\');document.getElementById(\'sdrop\').hidden=true;">'+
          '<span class="sr-name">'+esc(SNAMES.labels[r[0]])+'</span>'+
          '<span class="sr-loc" style="color:'+
          ({canon:'var(--canon)',commentary:'var(--comm)',subcommentary:'var(--tika)'})[SNAMES.layers[r[3]]]+
          '">'+LN2[SNAMES.layers[r[3]]]+' · '+SNAMES.vols[r[1]]+'</span></div>').join('');
    }
  }
  // !!! A QUERY WITH A SPACE MATCHED NOTHING AND SAID "No matches"
  // (2026-08-08, user-reported: "if I type a word after searching one it does
  // not search anymore").  The term keys are single words, so a spaced query
  // was neither an exact key nor a substring of any key: `matchTerms` returned
  // [], `vis` was null, and the box painted "No matches" — not a hang and not
  // stale state.  The query is now SPLIT on whitespace, each word resolved to
  // its terms separately (exact still wins outright, so `me` and `ca` resolve
  // although the 3-letter floor bars them from the substring sweep), the
  // volume lists intersected, and the per-paragraph postings intersected
  // inside each shard.  A paragraph carrying the words ADJACENT — the folded
  // phrase; shard text carries no doubled spaces, measured 0 of 559 in 06Di01
  // — is a phrase hit, counted by occurrence.  A paragraph carrying all the
  // words apart is listed AFTER the phrase hits and labelled as what it is,
  // never merged into the phrase count.  Measured on `evaṁ me sutaṁ`: 105
  // volumes carry all three words; 07Di02 holds 18 paragraphs with all three
  // and 10 with the phrase.
  const words=fq.split(/\s+/).filter(Boolean);
  const phq=words.join(' ');
  const anyWC=words.some(w=>w.indexOf('*')>=0);
  const phSrc=words.map(wpat).join(' ');
  const mtsPer=words.map(w=>matchTerms(w));
  let vis=null;
  if(mtsPer.length && mtsPer.every(m=>m.length)){
    const vsets=mtsPer.map(m=>new Set(m.flatMap(k=>TERMS.terms[k]||[])));
    vis=[...vsets[0]].filter(v=>vsets.every(s=>s.has(v))).sort((a,b)=>a-b);
    if(sLayer) vis=vis.filter(v=>TERMS.layers[v]===sLayer);
    if(!vis.length) vis=null;
  }
  // The filter chips and the "?" help are part of every results paint, so the
  // way OUT of an over-narrow filter is always on screen, and the instructions
  // are where the searching happens (2026-08-08, reader asked for both).
  const filtHTML='<div class="sr-filt">'
    +[['','r2_lay_all','All'],['pali-unicode','r2_lay_pali','Pāḷi'],['atthakatha-unicode','r2_lay_a','Aṭṭhakathā'],['tika-unicode','r2_lay_t','Ṭīkā']]
      .map(x=>'<span class="sr-chip'+(sLayer===x[0]?' on':'')+'" onclick="setSLayer(\''+x[0]+'\')">'+esc(TIP(x[1],x[2]))+'</span>').join('')
    +'<span class="sr-chip sr-help'+(sHelp?' on':'')+'" onclick="setSHelp()">?</span></div>'
    +(sHelp?'<div class="sr-helpbox">'+esc(TIP('r2_search_help',
      'Type one word, several words, or a phrase — a phrase matches the words adjacent and in order; words apart are listed separately. Diacritics are optional: nibbana finds nibbāna. * completes a word: dhamm*, *vaggo, dham*ti (3 letters minimum). A bare word also matches inside longer words. Chips above limit the search to one layer. Click a result to open it in the reader at the marked word.'))+'</div>':'');
  if(my!==sSeq) return;
  if(!vis){dd.hidden=false;
    dd.innerHTML=filtHTML+(secHTML||('<div class="sr-head">No matches for “'+esc(q)+'”'+(sLayer?' in this layer':'')+'</div>'));return;}
  const LN={'pali-unicode':'Pāḷi','atthakatha-unicode':'Aṭṭhakathā','tika-unicode':'Ṭīkā'};
  const COL={'pali-unicode':'var(--canon)','atthakatha-unicode':'var(--comm)','tika-unicode':'var(--tika)'};
  // !!! THE SHARDS WERE FETCHED ONE AT A TIME (2026-08-08, user-reported "it
  // is slow" — measured before touching anything, because the slowness had
  // three candidate causes and they measure very differently).  The substring
  // sweep over 643,965 term keys is 7–15 ms and its 500 cap lands early — not
  // the cost.  The 22 MB term map is paid once and says so on screen — left
  // alone.  But a common word matches up to 118 volumes, the shards average
  // 1.64 MB (194 MB in all), and this loop awaited them ONE PER ITERATION —
  // a serial download of most of the index before anything painted.  They are
  // now fetched 8 at a time; the per-shard work below then runs on cache hits.
  { const need=[...vis]; let ni=0; const pool=[];
    for(let w=0;w<Math.min(8,need.length);w++)
      pool.push((async()=>{ while(ni<need.length && my===sSeq){ await shard(need[ni++]); } })());
    await Promise.all(pool); }
  if(my!==sSeq) return;
  const countOcc=(hay,ndl)=>{ let n=0,i=hay.indexOf(ndl); while(i>=0){n++;i=hay.indexOf(ndl,i+1);} return n; };
  // adjacency with a wildcard in it needs the regex; without one, indexOf
  const phRxG=anyWC?new RegExp(phSrc,'g'):null;
  const phCount=f=>{ if(!anyWC) return countOcc(f,phq);
    phRxG.lastIndex=0; let n=0,m;
    while((m=phRxG.exec(f))){ if(!m[0]){phRxG.lastIndex++;continue;} n++; } return n; };
  const wordRxs=words.map(w=>new RegExp(wpat(w),'g'));
  const phRxA=new RegExp(phSrc,'g');
  // counted over EVERYTHING, not the 80 drawn rows — the head must say how
  // much there IS, like the word-lookup pane does (2026-08-08, user request)
  // `phrVols` counts volumes with PHRASE hits only — the head must not claim
  // three volumes for a phrase found in one because two others carry the
  // words apart
  let phrRows=[], andRows=[], total=0, andTotal=0, phrParas=0; const phrVols=new Set();
  for(const vi of vis){ const sh=await shard(vi);
    if(my!==sSeq) return;
    const maps=mtsPer.map(m=>{ const mm=new Map();
      for(const k of m) for(const [pi,c] of (sh.inv[k]||[])) mm.set(pi,(mm.get(pi)||0)+c);
      return mm; });
    const pis=[...maps[0].keys()].filter(pi=>maps.every(mm=>mm.has(pi))).sort((a,b)=>a-b);
    for(const pi of pis){ const p=sh.paras[pi];
      if(words.length>1){
        const f=foldS(p.text), c=phCount(f);
        if(c>0){ total+=c; phrParas++; phrVols.add(vi); if(phrRows.length<80) phrRows.push({vi,p,f}); }
        else    { andTotal++; if(andRows.length<40) andRows.push({vi,p,f}); }
      } else {
        total+=maps[0].get(pi); phrParas++; phrVols.add(vi);
        if(phrRows.length<80) phrRows.push({vi,p,f:foldS(p.text)});
      }
    }
  }
  // The book and sutta for every row that will be DRAWN — resolved from
  // `booktitle/`, never printed from the corpus's `book` field, which names
  // the wrong thing in 61 of 118 volumes (see `bookOf` above).  Only the
  // volumes actually on screen are fetched, and each stack is cached.
  const drawVols=[...new Set(phrRows.concat(andRows).map(r=>TERMS.vols[r.vi]))];
  const btMap={};
  await Promise.all(drawVols.map(async v=>{ btMap[v]=await btFor(v); }));
  if(my!==sSeq) return;
  const row=(r)=>{ const p=r.p, f=r.f, lay=TERMS.layers[r.vi], vol=TERMS.vols[r.vi];
    // anchor the snippet on the phrase where it occurs, else on the earliest
    // word — by regex throughout, so `*` matches are anchored and marked at
    // their real extent (`dhamm*` marks the whole of `dhammacakkhuṁ`)
    let i=-1,len=0;
    phRxA.lastIndex=0; const pm=phRxA.exec(f);
    if(pm&&pm[0]){ i=pm.index; len=pm[0].length; }
    else{ for(const rx of wordRxs){ rx.lastIndex=0; const m=rx.exec(f);
            if(m&&m[0]&&(i<0||m.index<i)){ i=m.index; len=m[0].length; } }
          if(i<0){ i=0; len=0; } }
    const a=Math.max(0,i-24), b=Math.min(p.text.length,i+len+42);
    // every query word inside the window is marked — the old builder assumed
    // ONE contiguous match and could not serve a multi-word row
    const R=[];
    for(const rx of wordRxs){ rx.lastIndex=0; let m;
      while((m=rx.exec(f))){ if(!m[0]){rx.lastIndex++;continue;} if(m.index>=b) break;
        if(m.index>=a) R.push([m.index,Math.min(m.index+m[0].length,b)]); } }
    R.sort((x,y)=>x[0]-y[0]);
    const M=[]; for(const rg of R){ if(M.length&&rg[0]<=M[M.length-1][1]) M[M.length-1][1]=Math.max(M[M.length-1][1],rg[1]); else M.push([rg[0],rg[1]]); }
    let snip=(a>0?'…':''), pos=a;
    for(const [s,e] of M){ snip+=esc(p.text.slice(pos,s))+'<mark>'+esc(p.text.slice(s,e))+'</mark>'; pos=e; }
    snip+=esc(p.text.slice(pos,b))+'…';
    // !!! `p.key` IS NOT A FIELD THE INDEX HAS EVER CARRIED (2026-08-02,
    // user-reported).  This row was built as `openKey(p.key, …)`; measured
    // over all 118 shards, `key` is present on 0 of 86,365 paragraphs and
    // `ord` on all of them — `build_search_index.py` says so in its own
    // docstring ("**`ord` is added**… the reader needs the ordinal"), and
    // `search.html` has always used `p.ord`.  So EVERY occurrence hit in
    // this box called `openKey('undefined', …)`: `parseKey` found no '#',
    // returned the volume as `'undefine'` (slice(0,-1)) and the ordinal as
    // NaN, the reader drew 0 paragraphs, and the layer band reported "No
    // Aṭṭhakathā is linked to the passages on screen" — a wrong answer that
    // reads as an honest one.  Fourth instance of this project's
    // characteristic failure: an ABSENT VALUE PRODUCED A CALL THAT LOOKED
    // LIKE A CALL.  Section hits above were never affected; they build the
    // key from `vols[]` + ord, which is what this now does.
    // A row whose ordinal is missing is drawn WITHOUT an onclick rather
    // than with a dead one, so the failure is visible instead of silent.
    const _k=(p.ord!=null)?(vol+'#'+p.ord):null;
    // "more information … the book and sutta, not just `Pāḷi ¶52`"
    // (2026-08-08, user-reported, with a screenshot).  Everything the line
    // needs was ALREADY in the shard and in `booktitle/` — display only.
    const _bk=bookOf(btMap[vol]||{},vol,p.ord!=null?p.ord:-1);
    const _su=(p.sutta&&p.sutta!=='X')?String(p.sutta).replace(/\s+/g,' ').trim():'';
    const _loc=[_bk,(_su&&_su!==_bk)?_su:'',vol].filter(Boolean).join(' · ');
    return '<div class="sresult'+(_k?'':' sr-dead')+'"'+(_k?' onclick="openHit(\''+_k+'\',\''+({'pali-unicode':'canon','atthakatha-unicode':'A','tika-unicode':'T'}[lay])+'\')"':'')+'><span class="sr-lay" style="color:'+COL[lay]+'">'+LN[lay]+(p.n!=null?' ¶'+p.n:(p.page!=null?' p.'+p.page:''))+'</span>'+(_loc?'<span class="sr-where">'+esc(_loc)+'</span>':'')+'<div class="sr-snip">'+snip+'</div></div>'; };
  // SECTIONS FIRST, THEN OCCURRENCES — the same order `search.html` uses, and
  // for the same reason: someone typing a sutta's name wants the sutta.
  if(my!==sSeq) return;
  let occHTML;
  const where=' in '+phrParas.toLocaleString()+' paragraph(s), '+phrVols.size.toLocaleString()+' volume(s)';
  if(words.length>1){
    occHTML=(total?'<div class="sr-head">'+total.toLocaleString()+' occurrence(s) of “'+esc(q)+'”'+where+'</div>'+phrRows.map(row).join(''):'')
      +(andTotal?'<div class="sr-head">'+andTotal.toLocaleString()+' paragraph(s) carry all '+words.length+' words, not adjacent</div>'+andRows.map(row).join(''):'');
    if(!total&&!andTotal) occHTML='<div class="sr-head">No matches for “'+esc(q)+'”</div>';
  } else {
    occHTML='<div class="sr-head">'+total.toLocaleString()+' occurrence(s) for “'+esc(q)+'”'+where+'</div>'+phrRows.map(row).join('');
  }
  dd.hidden=false; dd.innerHTML=filtHTML+secHTML+occHTML;
}
// A HIT MUST LAND ON THE WORD, NOT MERELY IN THE VOLUME.  A link from
// `search.html` carries `?q=` and `openFromURL` highlights it; this box called
// `openKey` bare, so once the key was right it still opened 364 paragraphs of
// the Visuddhimagga with nothing to say which one had been asked for.  Same
// poll-don't-guess shape as `openFromURL` — the paragraph is drawn
// asynchronously and a fixed delay races the render.
// !!! CENTRING THE PARAGRAPH IS NOT ARRIVING AT THE WORD (2026-08-02,
// user-reported: "it does not take one to the exact place where it is but one
// has to look around to find it").  A commentary paragraph is routinely taller
// than the window, so `scrollIntoView` on the PARAGRAPH puts its middle on
// screen and the word wherever it happens to fall.  Measured on 51Vism01 ¶180,
// the second hit for `medoti`:
//
//   1400x900  paragraph 1382px in a 797px viewport — word at y=575, low and
//             far from where the eye goes
//    390x844  paragraph 2841px in a  657px viewport — word at y=1228, i.e.
//             571px BELOW THE FOLD.  On a phone the hit was not on screen at
//             all, which is the report exactly.
//
// So: mark FIRST, then scroll to the mark.  And settle, because the first
// scroll happens on the first render and the layout is still moving under it —
// fonts resolve, page rules and the apparatus land — so a single scroll aims
// at a target that then walks away.  Bounded, and it stops as soon as two
// consecutive frames agree.
// Shares `_placeTok` with `holdAt`, so the LATEST scroll intent wins and two
// settles never fight each other: `openKey` schedules a hold that puts the
// arrival paragraph at the top of the view, and a search hit wants the WORD in
// the middle of it — before this was one shot each and the later one simply
// won; with both of them looping, the token is what decides.
async function settleTo(el){
  const tok=++_placeTok;
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  let prev=null;
  for(let i=0;i<12;i++){
    if(tok!==_placeTok) return;
    el.scrollIntoView({block:'center'});
    await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,60)));
    const y=Math.round(el.getBoundingClientRect().top);
    if(prev!==null && Math.abs(y-prev)<2) return;
    prev=y;
  }
}
async function landOn(el,q){
  if(q) markInEl(el,q);
  await settleTo(el.querySelector('mark.shl')||el);
}
async function openHit(key,kind){
  const dd=document.getElementById('sdrop'); if(dd) dd.hidden=true;
  const q=window.__hq||'';
  await openKey(key,kind);
  // `openKey` schedules its own top-of-view landing 60ms out; start after it,
  // so the hit's centring is the LATER intent and the token gives it the scroll
  await new Promise(r=>setTimeout(r,90));
  for(let i=0;i<40;i++){
    const el=document.getElementById('p-'+key.replace('#','-'));
    if(el){ await landOn(el,q); return; }
    await new Promise(r=>setTimeout(r,60));
  }
}
// !!! reader2 HAD NO URL HANDLING AT ALL (2026-07-30g).  The site's own
// navigation was split — `index.html` opened THIS reader while the top-nav
// Reader link and, more seriously, every SEARCH RESULT opened the older
// `reader.html` — and repointing them here would have silently dropped the
// target paragraph and the query, because nothing below `buildSidebar` ever
// read `location`.  So the two things the old reader supported are supported
// here before anything is repointed.
//
// THREE HASH FORMS ARE ACCEPTED.  `#VOL#ORD` is what search now emits, and it
// is exact.  `#VOL/ORD` is the same thing.  `#VOL/<id>` is the OLD reader's
// form, kept so a bookmark or an outside link still lands — resolved by
// scanning the volume for that `id`, which is NOT unique (12,110 collisions
// corpus-wide, REBUILD-PLAN Phase 2), so it lands on the first match exactly
// as the old reader did.  That ambiguity is the reason search now emits the
// ordinal instead.
const HLFOLD={'ā':'a','ī':'i','ū':'u','ṁ':'m','ṃ':'m','ṅ':'n','ñ':'n','ṭ':'t','ḍ':'d','ṇ':'n','ḷ':'l'};
const hfold=s=>s.toLowerCase().replace(/[āīūṁṃṅñṭḍṇḷ]/g,c=>HLFOLD[c]||c);
function markNeedles(el,needles){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  const nodes=[]; while(walker.nextNode()){ if(walker.currentNode.parentNode.nodeName!=='MARK') nodes.push(walker.currentNode); }
  let made=0;
  for(const node of nodes){
    const text=node.nodeValue, f=hfold(text);
    const R=[];
    for(const rx of needles){ rx.lastIndex=0; let m;
      while((m=rx.exec(f))){ if(!m[0]){rx.lastIndex++;continue;} R.push([m.index,m.index+m[0].length]); } }
    if(!R.length) continue;
    R.sort((a,b)=>a[0]-b[0]);
    const M=[]; for(const r of R){ if(M.length&&r[0]<=M[M.length-1][1]) M[M.length-1][1]=Math.max(M[M.length-1][1],r[1]); else M.push([r[0],r[1]]); }
    const frag=document.createDocumentFragment(); let last=0;
    for(const [s,e] of M){ if(s>last)frag.appendChild(document.createTextNode(text.slice(last,s)));
      const m=document.createElement('mark'); m.className='shl'; m.textContent=text.slice(s,e);
      frag.appendChild(m); last=e; }
    if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag,node);
    made+=M.length;
  }
  return made;
}
// A multi-word arrival tries the PHRASE first — one mark, exactly what was
// searched — and only if no text node carries the whole phrase (a bold lemma
// can split one across nodes, and an "all words, not adjacent" hit never had
// it) falls back to marking each word where it stands (2026-08-08).
// Needles are REGEXES so a `*` arrival marks the whole matched word.
function markInEl(el,q){
  if(!el||!q) return; const fq=hfold(q.trim()).replace(/\s+/g,' '); if(!fq) return;
  const words=fq.split(' ').filter(Boolean);
  if(markNeedles(el,[new RegExp(words.map(wpat).join(' '),'g')])) return;
  if(words.length>1) markNeedles(el,words.map(w=>new RegExp(wpat(w),'g')));
}
async function resolveHash(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,'')); if(!h) return null;
  let vol=null, rest=null;
  if(h.includes('#')){ [vol,rest]=h.split('#'); }
  else { const i=h.indexOf('/'); if(i<0) return null; vol=h.slice(0,i); rest=h.slice(i+1); }
  if(!vol||!(vol in VOLLAYER)) return null;
  if(/^\d+$/.test(rest)) return vol+'#'+rest;
  const c=await loadVol(vol);
  const i=(c.paras||[]).findIndex(p=>p&&p.id===rest);
  return i>=0 ? vol+'#'+i : vol+'#0';
}
async function openFromURL(){
  const key=await resolveHash(); if(!key) return false;
  const LK={canon:'canon',commentary:'A',subcommentary:'T'};
  const vol=parseKey(key)[0];
  await openKey(key, LK[VOLLAYER[vol]]||'canon');
  const q=new URLSearchParams(location.search).get('q')||'';
  // WAIT FOR THE PARAGRAPH, DO NOT GUESS A DELAY.  A fixed timeout raced the
  // reader's own render: the highlight appeared on some runs and not others,
  // which is the worst kind of green.  Polls a bounded number of times and
  // gives up quietly if the ordinal is never drawn (a hidden one, say).
  for(let i=0;i<40;i++){
    const el=document.getElementById('p-'+key.replace('#','-'));
    // same landing as the top-bar box — a link from search.html arrives at the
    // word, not at the middle of a paragraph that may be three screens tall
    if(el){ await landOn(el,q); return true; }
    await new Promise(r=>setTimeout(r,60));
  }
  return true;
}
buildSidebar().then(()=>openFromURL());
window.addEventListener('hashchange',()=>{ openFromURL(); });
</script>
