<!doctype html>
<html lang="pi">
<head>
<meta charset="utf-8">
<title>Reader — Sixth Buddhist Council Tipiṭaka</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="/reader/reader2.html">
<!--
  The old reader is retired (2026-07-30).  reader.html and reader2.html both
  existed for months and the site pointed at BOTH; the links were repointed, but
  a bookmark or an external link still landed on the frozen reader: no section
  search, no concordance-driven layer buttons, no book tooltips.

  This is an HTML redirect stub rather than a `_redirects` rule because the
  domain's serving host is not settled — `_redirects` is a Cloudflare feature and
  does nothing on GitHub Pages, and the repo publishes to both.  A stub works on
  either, and on any host we might move to.  The script preserves the query
  string and the fragment, so a legacy deep link of the form
      /reader/reader.html?q=X#VOL/<id>
  arrives at reader2 intact — reader2 understands that legacy hash form.

  The retired page itself is preserved in git history and as
  reader.html.bak_retired_20260730 on disk (published by neither host).
-->
<script>
  location.replace('/reader/reader2.html' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/reader/reader2.html">
<style>
  body{font:16px/1.5 Georgia,serif;margin:4rem auto;max-width:34rem;padding:0 1rem}
  a{color:#7a4a10}
</style>
</head>
<body>
<p>This reader has moved to <a id="go" href="/reader/reader2.html">the current reader</a>.</p>
<script>
  var g=document.getElementById('go');
  if(g) g.href='/reader/reader2.html'+location.search+location.hash;
</script>
</body>
</html>
