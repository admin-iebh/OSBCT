<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How the OSBCT website works</title>
<desc>The printed Sixth Council edition is converted and verified into the OSBCT repository, which holds site/ (the reader and 118 volumes, about 2,000 files) and stores/ (eight dictionaries, 24,599 files). GitHub Pages publishes site/ to buddha-dhamma.net; Cloudflare R2 serves the dictionaries from dict.buddha-dhamma.net. The reader in the browser draws the text from one origin and word lookups from the other. The Zenodo deposit archives site/ and stores/ together, so an archived copy still has a working dictionary panel.</desc>

<!-- ===================================================================
     THE ARCHITECTURE OF THE OSBCT SITE, AS DECIDED 2026-08-07.

     This draws the TARGET state: Option D (relocate the dictionary
     stores out of site/, keep them in the repo) combined with Option B
     (serve them from Cloudflare R2).  See docs/DEPLOY_SCALE.md 5a and 6.

     NOT YET BUILT when this file was written.  The stores are still at
     site/lookup/ and site/lookup_eval/ and are still published by Pages.
     If you are reading this and the repo has no stores/ directory, the
     relocation has not happened yet and this diagram is a plan.

     The two things it exists to keep distinct, because conflating them
     is the error DEPLOY_SCALE.md 2a was written to correct:

       * what Pages PUBLISHES  : fixed by the relocation
       * what the reader FETCHES : answered by R2

     They are orthogonal.  Either can change without the other.

     Self-contained on purpose: no external CSS, no webfonts, no host
     variables, so it renders in GitHub, in an <img>, and offline.  The
     background rect is explicit rather than transparent so it stays
     readable on a dark page.
     =================================================================== -->

<style>
  .ink   { fill: #1f1c19; }
  .muted { fill: #57534e; }
  .th    { font-size: 14px; font-weight: 500; }
  .t     { font-size: 14px; font-weight: 400; }
  .ts    { font-size: 12px; font-weight: 400; }
  .box   { fill: #ffffff; stroke: #d6d3d1; }
  .blue  { fill: #e8f0fb; stroke: #6b9bd6; }
  .amber { fill: #fbf1e0; stroke: #d8a24a; }
  .arr   { stroke: #78716c; stroke-width: 1.5; fill: none; }
</style>

<rect x="0" y="0" width="680" height="660" fill="#faf9f7"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#78716c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th ink" x="340" y="26" text-anchor="middle">Official Sixth Buddhist Council Tipi&#7789;aka &#183; how the site works</text>

<!-- the source -->
<rect class="box" x="190" y="48" width="300" height="60" rx="8" stroke-width="1"/>
<text class="th ink"  x="340" y="72" text-anchor="middle">The printed edition</text>
<text class="ts muted" x="340" y="92" text-anchor="middle">118 volumes &#183; final authority</text>

<line x1="340" y1="108" x2="340" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="352" y="127">converted and verified</text>

<!-- the repository -->
<rect class="box" x="60" y="142" width="580" height="156" rx="20" stroke-width="1"/>
<text class="th ink"  x="350" y="168" text-anchor="middle">The OSBCT repository</text>
<text class="ts muted" x="350" y="186" text-anchor="middle">everything tracked in one place</text>

<rect class="blue" x="80" y="200" width="240" height="80" rx="8" stroke-width="1"/>
<text class="th ink"  x="200" y="226" text-anchor="middle">site/</text>
<text class="ts muted" x="200" y="246" text-anchor="middle">reader + 118 volumes</text>
<text class="ts muted" x="200" y="266" text-anchor="middle">about 2,000 files</text>

<rect class="amber" x="380" y="200" width="240" height="80" rx="8" stroke-width="1"/>
<text class="th ink"  x="500" y="226" text-anchor="middle">stores/</text>
<text class="ts muted" x="500" y="246" text-anchor="middle">8 dictionaries</text>
<text class="ts muted" x="500" y="266" text-anchor="middle">24,599 files</text>

<line x1="200" y1="298" x2="200" y2="336" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="212" y="322">published</text>
<line x1="500" y1="298" x2="500" y2="336" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="512" y="322">uploaded</text>

<!-- the two origins -->
<rect class="blue" x="80" y="340" width="240" height="56" rx="8" stroke-width="1"/>
<text class="th ink"  x="200" y="364" text-anchor="middle">GitHub Pages</text>
<text class="ts muted" x="200" y="382" text-anchor="middle">buddha-dhamma.net</text>

<rect class="amber" x="380" y="340" width="240" height="56" rx="8" stroke-width="1"/>
<text class="th ink"  x="500" y="364" text-anchor="middle">Cloudflare R2</text>
<text class="ts muted" x="500" y="382" text-anchor="middle">dict.buddha-dhamma.net</text>

<line x1="200" y1="396" x2="268" y2="450" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="190" y="428" text-anchor="end">the text</text>
<line x1="500" y1="396" x2="432" y2="450" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="510" y="428">a word&#8217;s meaning</text>

<!-- the reader -->
<rect class="box" x="170" y="454" width="360" height="76" rx="8" stroke-width="1"/>
<text class="th ink"  x="350" y="482" text-anchor="middle">The reader, in a browser</text>
<text class="ts muted" x="350" y="502" text-anchor="middle">opens a page, clicks a word</text>
<text class="ts muted" x="350" y="520" text-anchor="middle">one origin for each</text>

<!-- the deposit: why the stores stay in the repo -->
<path d="M60 220 L24 220 L24 580 L104 580" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect class="box" x="110" y="552" width="250" height="56" rx="8" stroke-width="1"/>
<text class="th ink"  x="235" y="576" text-anchor="middle">Zenodo deposit &#183; DOI</text>
<text class="ts muted" x="235" y="594" text-anchor="middle">both folders archived together</text>

<rect class="blue"  x="410" y="561" width="12" height="12" rx="3" stroke-width="1"/>
<text class="ts muted" x="430" y="571">the corpus and reader</text>
<rect class="amber" x="410" y="585" width="12" height="12" rx="3" stroke-width="1"/>
<text class="ts muted" x="430" y="595">the dictionaries</text>

<text class="ts muted" x="340" y="638" text-anchor="middle">The dashed line is the reason the stores stay in the repository: an archived copy still has its dictionaries.</text>
</svg>
